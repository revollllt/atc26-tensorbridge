[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorbridge"
version = "0.1.0"
description = "TensorBridge: a fused NVFP4 W4A8 GEMM kernel for Hopper GPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "triton",
    "filelock",
    "pyelftools",
]

[project.optional-dependencies]
cu12 = [
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-cccl-cu12",
    "nvidia-cuda-nvcc-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "cuda-python>=12,<13",
]
cu13 = [
    "nvidia-cuda-runtime",
    "nvidia-cuda-cccl",
    "nvidia-cuda-nvcc",
    "nvidia-cuda-nvrtc",
    "cuda-python>=13,<14",
]

[tool.setuptools]
include-package-data = true

[project.entry-points."vllm.general_plugins"]
tensorbridge = "tensorbridge.vllm_plugin:register"

[tool.setuptools.package-data]
"*" = ["*.cuh", "*.cpp", "*.h", "*.hpp", "*.json"]

[tool.ruff]
line-length = 100

[tool.mypy]
disable_error_code = ["no-untyped-call", "no-untyped-def", "type-arg", "untyped-decorator", "no-any-return"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["tensorbridge*"]
